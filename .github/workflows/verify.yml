name: Validate public portfolio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify publication allowlist and history
        run: python3 scripts/check_site.py --tracked --history
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/content.js
          node --check assets/js/app.js
